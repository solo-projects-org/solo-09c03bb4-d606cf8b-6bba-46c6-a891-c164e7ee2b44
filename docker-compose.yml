services:
  validation-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: followup-validation-api:local
    container_name: followup-validation-api
    ports:
      - "8000:8000"
    environment:
      # Capacity is process-wide; keep a single worker so the two-slot limit
      # and in-memory job registry are authoritative for the whole site.
      WEB_CONCURRENCY: "1"
    # Job state is intentionally in memory: no volumes, no persistence.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
